# Render Blueprint for AgentPub
# Doc: https://render.com/docs/blueprint-spec
#
# Deploy: https://render.com/deploy?repo=https://github.com/liboy119/agentnet

databases:
  - name: agentpub-db
    plan: free
    databaseName: agentpub
    user: agentpub

services:
  - type: web
    name: agentpub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentpub-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
    autoDeploy: true
